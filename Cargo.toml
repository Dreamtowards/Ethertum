[package]
name = "ethertia"
version = "0.2.8"
edition = "2021"
default-run = "ethertia"

[features]
default = ["target_native_os"]
target_native_os = [
    "dep:native-dialog",
    "dep:memory-stats",
    "dep:sysinfo",
    #"reqwest?/blocking",
]
target_web = []
experimental_channel = []
ddgi = []
ddgi2 = []


[dev-dependencies]
# Avoid enabling `dynamic_linking` here: dev-dep features unify with `dependencies.bevy`
# and force the slow per-crate DLL link path for normal desktop builds.
bevy = { version = "0.20.0", features = ["file_watcher", "trace_chrome", "bevy_solari", "jpeg"] }
# cargo run --features bevy/trace_tracy


[dependencies]
bevy = { version = "0.20.0", features = ["bevy_solari", "jpeg"] }

avian3d = { git = "https://github.com/andriyDev/avian", rev = "34c9b008d2f40638a953d9218db48d54f661365d" }
bevy_renet = { git = "https://github.com/simgine/renet", rev = "495716ff33fa8e7b8999658d570a72ea348027e8" }
# bevy_fps_controller = "0.2.3"
# bevy_rapier3d = "0.23"

#bevy_egui = { git = "https://github.com/okkmnone/bevy_egui.git", branch = "v0.24.0.tmpfix", default-features = false, features = ["open_url", "default_fonts"] }
#bevy-inspector-egui = { git = "https://github.com/okkmnone/bevy-inspector-egui.git", branch = "v0.22.1.fix" }
bevy_egui = "0.43.1"
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui", rev = "9a5b0866ec764ab9baec0f1361f4edac2ea0e764" }
# Legacy Bevy 0.13 touch input prototype; the plugin is currently commented out.
# Keep it out of desktop builds until the mobile input path is migrated.
bevy_touch_stick = { version = "0.2", optional = true }
egui_extras = { version = "0.36", default-features = false, features = [] }
egui-notify = "0.23"
leafwing-input-manager = { git = "https://github.com/Leafwing-Studios/leafwing-input-manager", rev = "afae710d2766aad32635954406a852b8c56a8071" }

bevy_common_assets = { git = "https://github.com/NiklasEi/bevy_common_assets", rev = "e90d64399e477e233e57d5735f7daa28e84520ff", features = ["json"] }
bevy_obj = { path = "crates/bevy_obj" }

noise = "0.9"
bincode = "1.3"
serde = "1.0"
serde_json = "1.0" 
image = "0.25"  # for atlas gen
tiny_http = "0.12"  # for RCON http server
half ="2.7"

thread_local = "1.1"
once_cell = "1.19"
futures-lite = "2.0.1"  # async poll task

sysinfo = { version = "0.39", optional = true }
native-dialog = { version = "0.9", optional = true }
memory-stats = { version = "1.2", optional = true }
log = "0.4.20"
env_logger = "0.11"
chrono = "0.4"
anyhow = "1.0"  # error handling
human_bytes = "0.4"

rand = "0.9"
instant = "0.1"
crossbeam-channel = "0.5"
shlex = "1.3"
bit-set = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[workspace]
resolver = "2" # Important! wgpu/bevy needs this!
members = ["crates/*"]

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# further improve performances in a noticeable way, even for a release build (though the build itself will take longer to complete):
[profile.release]
lto = true
codegen-units = 1
strip = true
# opt-level = "z"  # "z"=34.4 MB, zip=9.25 MB


# cargo build --target wasm32-unknown-unknown --profile web-release
[profile.web-release]
inherits = "release"
opt-level = "z"  # default=39.2mb, "z"=17.3mb, 

[profile.android-debug]
inherits = "dev"
opt-level = 3
